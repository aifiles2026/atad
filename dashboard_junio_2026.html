<style>
:root{
  --navy:#0D1F3C;--navy2:#1B3A6B;--dark:#1A1A2E;--gray:#4A5568;
  --gold:#F5A623;--teal:#00A99D;--green:#1B7F4F;--green-bg:#D4EDDA;--green-tx:#1B7F4F;
  --yellow-bg:#FFF3CD;--yellow-tx:#856404;--silver:#C0C0C0;--bronze:#CD7F32;
  --blue-bg:#EBF3FB;--red:#B02A37;--red-bg:#F8D7DA;--bg:#F0F4FA;
  --border:#D0D7E2;--white:#fff;--sub:#B0C4DE;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Calibri,Arial,sans-serif;background:var(--bg);color:var(--dark);}
.topbar{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:28px 40px 22px;}
.topbar h1{font-size:1.7rem;font-weight:800;margin-bottom:4px;}
.topbar p{color:var(--sub);font-size:0.88rem;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;}
.kpi{border-radius:10px;padding:14px 16px;background:rgba(255,255,255,0.1);}
.kpi .lbl{font-size:0.68rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85;margin-bottom:4px;}
.kpi .val{font-size:1.3rem;font-weight:800;}
.kpi .sub-val{font-size:0.75rem;opacity:.8;margin-top:2px;}
.kpi.gold{background:var(--gold);color:var(--dark);}
.kpi.teal{background:var(--teal);}
.kpi.green{background:var(--green);}
.kpi.red{background:var(--red);}

.tabs{background:var(--navy);display:flex;gap:2px;padding:0 28px;overflow-x:auto;position:sticky;top:0;z-index:100;}
.tab{padding:11px 14px;color:var(--sub);cursor:pointer;font-size:0.78rem;font-weight:700;
  border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;}
.tab:hover{color:#fff;}
.tab.active{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,0.07);}

.container{max-width:1280px;margin:0 auto;padding:24px 24px 80px;}
.section{display:none;}
.section.active{display:block;animation:fi .2s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}

.card{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:18px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(20,30,60,.05);}
.card h2{font-size:1.05rem;color:var(--navy2);margin-bottom:4px;}
.card .sub{font-size:0.78rem;color:var(--gray);margin-bottom:14px;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}.kpi-row{grid-template-columns:1fr 1fr;}}

table{width:100%;border-collapse:collapse;font-size:0.8rem;}
thead th{background:var(--navy);color:#fff;padding:8px 8px;text-align:center;font-size:0.7rem;text-transform:uppercase;position:sticky;top:0;}
tbody td{padding:6px 8px;border-bottom:1px solid #EEF1F6;text-align:center;}
tbody td.left{text-align:left;}
tbody tr:nth-child(even){background:var(--blue-bg);}
.scroll-tbl{max-height:480px;overflow-y:auto;border-radius:8px;border:1px solid var(--border);}

.pill{display:inline-block;padding:2px 8px;border-radius:14px;font-weight:700;font-size:0.74rem;}
.pill.g{background:var(--green-bg);color:var(--green-tx);}
.pill.r{background:var(--red-bg);color:var(--red);}
.pill.y{background:var(--yellow-bg);color:var(--yellow-tx);}
.pill.b{background:var(--blue-bg);color:var(--navy2);}

.var-up{color:var(--green);font-weight:700;}
.var-dn{color:var(--red);font-weight:700;}
.var-neu{color:var(--gray);}

.op-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:6px 13px;border-radius:20px;background:var(--blue-bg);color:var(--navy2);
  font-size:0.78rem;font-weight:700;cursor:pointer;transition:all .15s;}
.chip:hover{background:#dce8f7;}
.chip.active{background:var(--navy2);color:#fff;}

.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:0.72rem;font-weight:600;margin:2px;}
.tag.new{background:#D4EDDA;color:#1B7F4F;}
.tag.out{background:#F8D7DA;color:#B02A37;}
.tag.keep{background:#EBF3FB;color:#1B3A6B;}

.badge-var{display:inline-flex;align-items:center;gap:3px;font-size:0.75rem;font-weight:700;}
.note{border-radius:8px;padding:12px 14px;font-size:0.82rem;line-height:1.5;margin-bottom:10px;}
.note.ok{background:var(--green-bg);color:var(--green-tx);border-left:4px solid var(--green);}
.note.warn{background:var(--yellow-bg);color:var(--yellow-tx);border-left:4px solid var(--gold);}
.note.info{background:var(--blue-bg);color:var(--navy2);border-left:4px solid var(--navy2);}
</style>
</head>

<script>
const DATA=JSON.parse(document.getElementById('D').textContent);
const fmt=n=>'₡'+Math.round(n).toLocaleString('es-CR');
const fmtN=n=>Math.round(n).toLocaleString('es-CR');
const fmtP=n=>(n*100).toFixed(1)+'%';
const varArrow=v=>v>0?'▲':'▼';
const varClass=v=>v>0?'var-up':'var-dn';
const varFmt=(v,isMoney=true)=>`<span class="${varClass(v)}">${varArrow(v)} ${isMoney?fmt(Math.abs(v)):fmtN(Math.abs(v))}</span>`;
const varPctFmt=v=>`<span class="${varClass(v)}">${varArrow(v)} ${Math.abs(v*100).toFixed(1)}%</span>`;
const rankFill=i=>i===0?'#F5A623':i===1?'#C0C0C0':i===2?'#CD7F32':null;

const T=DATA.totals;

document.getElementById('topKpis').innerHTML=`

      <tbody>
        ${sorted.map((o,i)=>`<tr>
          <td>${i+1}</td><td class="left"><strong>${o.emoji} ${o.op}</strong></td>
          <td>${fmt(o.ventas_jun)}</td><td>${fmt(o.ventas_may)}</td>
          <td>${varFmt(o.var_ventas)}</td><td>${varPctFmt(o.var_pct)}</td>
          <td>${o.prods_jun}</td><td>${o.prods_may}</td>
          <td>${varFmt(o.var_prods,false)}</td>

          <td>${fmt(T.ventas_jun)}</td><td>${fmt(T.ventas_may)}</td>

function renderEssTable(op){
  const o=DATA.ops.find(x=>x.op===op);

  const maySet=new Set(o.ess_may_list.map(r=>r['Nombre Artículo']));
  return `
  <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
    <span class="tag new">🆕 ${o.ess_nuevos.length} nuevos en esenciales</span>
    <span class="tag out">⬇️ ${o.ess_salieron.length} salieron de esenciales</span>
    <span class="tag keep">✓ ${o.ess_mantienen.length} se mantienen</span>
  </div>
  <div class="scroll-tbl"><table>
    <thead><tr><th>#</th><th>Producto</th><th>Categoría</th><th>Cant. Jun</th><th>Ingreso Jun (₡)</th><th>% Ingreso</th><th>Estado vs Mayo</th></tr></thead>
    <tbody>
      ${o.ess_jun_list.map((r,i)=>{
        const isNew=!maySet.has(r['Nombre Artículo']);
        const rf=rankFill(i);
        return `<tr>
          <td style="${rf?'background:'+rf+';color:#fff;':''}font-weight:700;">${i+1}</td>
          <td class="left"><strong>${r['Nombre Artículo']}</strong></td>
          <td class="left">${r.Categoría}</td>
          <td>${fmtN(r.Cant)}</td>
          <td><span class="pill g">${fmtN(r.Monto)}</span></td>
          <td>${fmtP(r.PctIngreso)}</td>
          <td>${isNew?'<span class="tag new">🆕 Nuevo</span>':'<span class="tag keep">✓ Continúa</span>'}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>
  ${o.ess_salieron.length>0?`
  <div class="note warn" style="margin-top:12px;">
    <strong>⬇️ Salieron de esenciales en junio:</strong> ${o.ess_salieron.map(p=>`<span class="tag out">${p}</span>`).join(' ')}
  </div>`:''}`;
}

    <div class="sub">Gasto en insumos comparables (excluye categorías administrativas)</div>

        ${dep.map((r,i)=>`<tr>
          <td>${i+1}</td><td class="left"><strong>${r.Departamento}</strong></td>
          <td>${fmt(r.Junio)}</td><td>${fmt(r.Mayo)}</td>
          <td>${varFmt(r.Var)}</td>
          <td>${r.VarPct!==null?varPctFmt(r.VarPct):'<span class="var-up">NUEVO</span>'}</td>

    </table></div>

      ⚠️ <strong>MENAJE</strong> muestra un incremento inusual (+1,657% vs mayo). Se recomienda verificar si corresponde a una compra extraordinaria de equipos o un error de clasificación.

}

function renderMovimientos(){

function renderMovTable(op){
  const o=DATA.ops.find(x=>x.op===op);

// ---- WIRE ----
const renderers={
  resumen:renderResumen, comp_ventas:renderCompVentas,
  esenciales:renderEsenciales, eliminar:renderEliminar,
  compras:renderCompras, ahorro:renderAhorro, movimientos:renderMovimientos
};

function wireChips(chipId,tableId,renderFn){
  const cont=document.getElementById(chipId);
  if(!cont)return;
  const chips=cont.querySelectorAll('.chip');
  if(chips.length) document.getElementById(tableId).innerHTML=renderFn(chips[0].dataset.op);
  chips.forEach(c=>c.addEventListener('click',()=>{
    chips.forEach(x=>x.classList.remove('active')); c.classList.add('active');
    document.getElementById(tableId).innerHTML=renderFn(c.dataset.op);
  }));
}

function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.getElementById('app').innerHTML=renderers[name]();
  wireChips('essChips','essTable',renderEssTable);
  wireChips('elimChips','elimTable',renderElimTable);
  wireChips('movChips','movTable',renderMovTable);
  window.scrollTo(0,0);
}

document.getElementById('tabBar').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(t) showTab(t.dataset.tab);
});
showTab('resumen');
</script>
