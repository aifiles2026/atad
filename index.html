<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Reporte Ejecutivo — Mayo 2026</title>
<style>
:root{
  --navy:#0D1F3C; --navy2:#1B3A6B; --dark:#1A1A2E; --gray:#4A5568;
  --gold:#F5A623; --teal:#00A99D; --green:#1B7F4F; --green-bg:#D4EDDA;
  --yellow-bg:#FFF3CD; --yellow-tx:#856404; --silver:#C0C0C0; --bronze:#CD7F32;
  --blue-bg:#EBF3FB; --red:#B02A37; --red-bg:#F8D7DA; --bg:#F0F4FA;
  --border:#D0D7E2; --white:#fff;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Segoe UI',Calibri,Arial,sans-serif; background:var(--bg); color:var(--dark);}

/* TOP BAR */
.topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%); color:#fff; padding:32px 44px 28px;}
.topbar h1{font-size:1.9rem; font-weight:800; margin-bottom:6px;}
.topbar p{color:#B0C4DE; font-size:0.92rem;}
.top-kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:22px;}
.top-kpi{background:rgba(255,255,255,0.1); border-radius:10px; padding:14px 18px;}
.top-kpi .lbl{font-size:0.7rem; text-transform:uppercase; letter-spacing:.05em; opacity:.8; margin-bottom:5px;}
.top-kpi .val{font-size:1.35rem; font-weight:800;}
.top-kpi.gold{background:var(--gold); color:var(--dark);}
.top-kpi.green{background:var(--green);}
.top-kpi.red{background:var(--red);}
.top-kpi.teal{background:var(--teal);}

/* NAV */
.nav-wrap{background:var(--navy); position:sticky; top:0; z-index:100; padding:0 32px; display:flex; gap:2px; overflow-x:auto;}
.nav-btn{padding:12px 14px; color:#B0C4DE; cursor:pointer; font-size:0.78rem; font-weight:700;
  border-bottom:3px solid transparent; white-space:nowrap; transition:all .15s; user-select:none;}
.nav-btn:hover{color:#fff;}
.nav-btn.active{color:#fff; border-bottom-color:var(--gold); background:rgba(255,255,255,0.07);}

/* MAIN */
.container{max-width:1240px; margin:0 auto; padding:28px 28px 80px;}
.section{display:none;}
.section.active{display:block; animation:fi .2s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}

/* SUMMARY CARDS */
.summary-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:22px;}
@media(max-width:900px){.summary-grid{grid-template-columns:1fr;} .top-kpis{grid-template-columns:1fr 1fr;}}
.s-card{background:#fff; border-radius:12px; padding:20px 22px; border:1px solid var(--border); box-shadow:0 1px 4px rgba(20,30,60,.05);}
.s-card h3{font-size:0.95rem; color:var(--navy2); margin-bottom:4px;}
.s-card .sub{font-size:0.78rem; color:var(--gray); margin-bottom:14px;}

/* OP CARD */
.op-header{background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; border-radius:14px;
  padding:24px 28px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
.op-header h2{font-size:1.5rem; font-weight:800;}
.op-header .op-kpis{display:flex; gap:14px; flex-wrap:wrap;}
.op-kpi{background:rgba(255,255,255,0.12); border-radius:8px; padding:10px 16px; text-align:center; min-width:110px;}
.op-kpi .k-lbl{font-size:0.65rem; text-transform:uppercase; letter-spacing:.05em; opacity:.8; margin-bottom:3px;}
.op-kpi .k-val{font-size:1.1rem; font-weight:800;}
.op-kpi.gold{background:var(--gold); color:var(--dark);}
.op-kpi.red-kpi{background:var(--red);}
.op-kpi.green-kpi{background:var(--green);}

/* OPPORTUNITY BOXES */
.opp-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:22px;}
@media(max-width:1000px){.opp-grid{grid-template-columns:1fr;}}
.opp-box{border-radius:10px; padding:16px 18px; border-left:5px solid;}
.opp-box.green-box{background:var(--green-bg); border-color:var(--green);}
.opp-box.red-box{background:var(--red-bg); border-color:var(--red);}
.opp-box.blue-box{background:var(--blue-bg); border-color:var(--navy2);}
.opp-box .opp-title{font-size:0.78rem; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin-bottom:6px;}
.opp-box.green-box .opp-title{color:var(--green);}
.opp-box.red-box .opp-title{color:var(--red);}
.opp-box.blue-box .opp-title{color:var(--navy2);}
.opp-box .opp-val{font-size:1.5rem; font-weight:800; margin-bottom:4px;}
.opp-box.green-box .opp-val{color:var(--green);}
.opp-box.red-box .opp-val{color:var(--red);}
.opp-box.blue-box .opp-val{color:var(--navy2);}
.opp-box .opp-desc{font-size:0.82rem; color:var(--gray); line-height:1.5;}

/* RECOM */
.recom-box{background:#fff; border-radius:10px; padding:18px 20px; margin-bottom:18px; border:1px solid var(--border);}
.recom-box h4{font-size:0.95rem; color:var(--navy2); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.recom-item{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; font-size:0.86rem; line-height:1.5;}
.recom-item .badge{min-width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:0.72rem; font-weight:800; color:#fff; flex-shrink:0; margin-top:1px;}
.badge.g{background:var(--green);}
.badge.r{background:var(--red);}
.badge.b{background:var(--navy2);}
.badge.y{background:var(--gold); color:var(--dark);}

/* TABLES */
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.tbl-wrap{background:#fff; border-radius:10px; padding:16px 18px; border:1px solid var(--border);}
.tbl-wrap h4{font-size:0.88rem; font-weight:700; margin-bottom:10px;}
.tbl-wrap h4.green{color:var(--green);}
.tbl-wrap h4.red{color:var(--red);}
table{width:100%; border-collapse:collapse; font-size:0.8rem;}
thead th{background:var(--navy); color:#fff; padding:7px 8px; text-align:center; font-size:0.72rem; text-transform:uppercase;}
tbody td{padding:6px 8px; border-bottom:1px solid #EEF1F6; text-align:center;}
tbody td.left{text-align:left;}
tbody tr:nth-child(even){background:var(--blue-bg);}
.pill{display:inline-block; padding:2px 8px; border-radius:14px; font-weight:700; font-size:0.74rem;}
.pill.g{background:var(--green-bg); color:var(--green);}
.pill.r{background:var(--red-bg); color:var(--red);}
.pill.y{background:var(--yellow-bg); color:var(--yellow-tx);}
.divider{height:1px; background:var(--border); margin:24px 0;}
</style>
</head>

    </div>
    <div class="opp-box red-box">
      <div class="opp-title">🗑️ Oportunidad — Eliminar Bajo Desempeño</div>
      <div class="opp-val">${fmt(o.elim_monto)}</div>
      <div class="opp-desc">${o.elim_count} productos representan menos del 15% del ingreso. Eliminarlos libera espacio, reduce merma y simplifica la operación.</div>
    </div>
    <div class="opp-box blue-box">
      <div class="opp-title">📐 Margen por Precio Esenciales (+4%)</div>
      <div class="opp-val">${fmt(o.ess_monto * 0.04)}</div>
      <div class="opp-desc">Incremento mensual estimado si se aplica un ajuste del 4% sobre los precios de venta de los ${o.ess_count} productos esenciales.</div>
    </div>
  </div>

  <div class="recom-box">
    <h4>🎯 Recomendaciones para ${o.op}</h4>
    ${recom.map(r=>`<div class="recom-item"><div class="badge ${r.t}">${r.t==='g'?'✓':r.t==='r'?'✕':r.t==='b'?'↗':'$'}</div><div>${r.txt}</div></div>`).join('')}
  </div>

  <div class="two-col">
    <div class="tbl-wrap">
      <h4 class="green">⭐ Top ${Math.min(10,o.ess.length)} Esenciales — Nunca Deben Faltar</h4>
      <table>
        <thead><tr><th>#</th><th>Producto</th><th>Cant.</th><th>Ingreso (₡)</th><th>% Ingreso</th></tr></thead>
        <tbody>
          ${o.ess.slice(0,10).map((r,i)=>`<tr>
            <td>${i+1}</td><td class="left"><strong>${r['Nombre Artículo']}</strong></td>
            <td>${fmtN(r.Cant)}</td>
            <td><span class="pill g">${fmtN(r.Monto)}</span></td>
            <td>${fmtP(r.PctIngreso*100)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="tbl-wrap">
      <h4 class="red">🗑️ Top ${Math.min(15,o.elim.length)} Candidatos a Eliminar</h4>
      <table>
        <thead><tr><th>#</th><th>Producto</th><th>Cant.</th><th>Ingreso (₡)</th></tr></thead>
        <tbody>
          ${o.elim.slice(0,15).map((r,i)=>`<tr>
            <td>${i+1}</td><td class="left">${r['Nombre Artículo']}</td>
            <td>${fmtN(r.Cant)}</td>
            <td><span class="pill r">${fmtN(r.Monto)}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>
  `;
}

const renderers = {'resumen': renderResumen};
D.ops.forEach(o=>{ renderers[o.op] = ()=>renderOp(o); });

function showTab(name){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.getElementById('app').innerHTML = renderers[name] ? renderers[name]() : '';
  window.scrollTo(0,0);
}

document.getElementById('navWrap').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-btn');
  if(btn) showTab(btn.dataset.tab);
});

showTab('resumen');
</script>
</body>
</html>
